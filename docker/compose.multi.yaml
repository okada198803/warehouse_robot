name: pai_multi   # 複数ロボット検証用。単体構成(docker/compose.yaml、pai-ros)とは別コンテナ。同時には起動しない(負荷のため)
# 使い方: COMPOSE_FILE=compose.multi.yaml docker compose up -d (run_multi_auto.sh は自動で設定する)
services:
  ros:
    build: .
    image: pai-final-ros:humble
    container_name: pai-ros-multi
    platform: linux/arm64
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined   # Gazebo の GUI が真っ黒になる場合の対策
    ports:
      - "6081:80"      # noVNC (ブラウザで http://localhost:6081)
      - "9091:9090"    # rosbridge(複数ロボット検証用。単体構成の 9090 と衝突させない)
    environment:
      - RESOLUTION=1600x900
    volumes:
      - ../ros2_ws:/home/ubuntu/ros2_ws
